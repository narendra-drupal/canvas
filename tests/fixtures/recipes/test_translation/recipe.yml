# cspell:ignore région
name: 'Test Translation'
description: 'Creates canvas page and content template entities with French translations for testing translation scenarios'
type: 'Canvas'
install:
  - language
  - content_translation
  - canvas_dev_translation
config:
  strict: false
  import:
    canvas: '*'
  actions:
    # language.entity.en must exist alongside language.entity.fr for
    # LanguageServiceProvider::isMultilingual() to return true (it counts
    # language.entity.* configs, requiring > 1). Without two language entities,
    # path_processor_language is never registered in the DI container, so
    # /fr/canvas/api/v0/... returns 404 instead of the language prefix being
    # stripped and the request routed correctly.
    # Note: the language module's config/install/language.entity.en.yml is
    # skipped during recipe module install (isSyncing=true skips config entities
    # in ConfigInstaller::createConfiguration()), so we must create it explicitly.
    # createIfNotExists is used because a site may already have this entity if
    # the language module was installed outside of the recipe.
    language.entity.en:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: en
        label: English
        direction: ltr
        weight: 0
        locked: false
    language.entity.fr:
      create:
        id: fr
        label: French
    language.entity.es:
      create:
        id: es
        label: Spanish
    language.content_settings.canvas_page.canvas_page:
      create:
        target_entity_type_id: canvas_page
        target_bundle: canvas_page
        third_party_settings:
          content_translation:
            enabled: true
    # @todo Remove setLanguageOverride and replace with config/language/{langcode}/
    #   files once https://drupal.org/i/3453331 is fixed.
    canvas.page_region.stark.sidebar_first:
      setLanguageOverride:
        language: fr
        data:
          component_tree:
            33333333-3333-4333-8333-333333333333:
              label: 'French region heading'
              inputs:
                text: 'Bonjour de la région'
